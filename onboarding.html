<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Typing 시작하기</title>
    <link rel="stylesheet" href="css/onboarding.css">
</head>
<body>
    <main class="onboarding">
        <section class="onboarding__hero" aria-labelledby="onboarding-title">
            <div class="onboarding__badge">HELLO TYPING</div>
            <img class="onboarding__mascot" src="assets/hello-kitty.png" alt="헬로키티 캐릭터">
            <p class="onboarding__eyebrow">작은 키보드 모험</p>
            <h1 id="onboarding-title">Hello<br>Typing</h1>
            <p class="onboarding__intro">제한 시간 안에 나타나는 문자를 빠르게 입력하고<br>나만의 최고 점수에 도전해 보세요.</p>
            <a class="onboarding__start" href="typing_game.html">게임 시작하기 <span aria-hidden="true">→</span></a>
            <a class="onboarding__skip" href="#steps-title">플레이 방법 먼저 보기</a>
        </section>

        <section class="onboarding__steps" aria-labelledby="steps-title">
            <h2 id="steps-title">이렇게 플레이해요</h2>
            <div class="onboarding__step-list">
                <article class="onboarding__step">
                    <span class="onboarding__step-number">01</span>
                    <h3>문자 확인</h3>
                    <p>화면 가운데 나타난<br>문자를 확인해요.</p>
                </article>
                <article class="onboarding__step">
                    <span class="onboarding__step-number">02</span>
                    <h3>키보드 입력</h3>
                    <p>대문자와 소문자를<br>정확히 입력해요.</p>
                </article>
                <article class="onboarding__step">
                    <span class="onboarding__step-number">03</span>
                    <h3>점수 도전</h3>
                    <p>Easy 40초, Hard 20초<br>안에 도전해요.</p>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
