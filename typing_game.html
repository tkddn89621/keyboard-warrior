<!--
    1. 아래 게임의 문제점을 발견하고, 개선점을 제시하세요. 정답은 없습니다.
    2. 디자인을 개선해보세요.

    [구조 안내]
    이 파일은 '골격'만 담당합니다. 마크업 구조와 id/class만 두고,
    디자인은 css/style.css, 동작은 js/*.js 에서 수정하세요.

    담당 나누기 예시
      - A : css/style.css      (디자인)
      - B : js/ui.js           (화면 표시)
      - C : js/game.js         (게임 규칙/진행)
      - 공통 : js/config.js    (설정값 — 바꿀 일 있으면 서로 알리고 수정)
 -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="game">
        <h1 class="game__title">Typing Game</h1>

        <p class="game__guide">아래 문자를 입력하세요. (소/대문자 구분)</p>

        <!-- 지금 입력해야 할 문자가 표시되는 곳 -->
        <div class="game__target" id="targetChar"></div>

        <div class="game__status">
            <div class="game__score" id="score"></div>
            <div class="game__timer" id="timer"></div>
            <div class="game__combo" id="combo"></div>
            <input class="game__input" id="typedInput" type="text" placeholder="입력한 문자가 여기에 표시됩니다" readonly>
        </div>

        <label class="game__mode">
            난이도
            <select id="modeSelect">
                <option value="easy">Easy</option>
                <option value="hard">Hard</option>
            </select>
        </label>

        <div class="game__controls">
            <button type="button" class="game__button" id="startButton">Start</button>
            <button type="button" class="game__button" id="resetButton">Reset</button>
        </div>
    </main>

    <!-- 순서 중요: config → ui → game -->
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
